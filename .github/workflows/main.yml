name: RDP-Roblox-HighPerf

on:
  workflow_dispatch:

jobs:
  secure-rdp-roblox:
    runs-on: windows-latest # Usa a máquina mais potente do GitHub (8 vCPU / 32GB RAM)
    
    env:
      TS_VERSION: "1.82.0"
      
    steps:
      - name: Maximize System Performance & Spoof VM Identity
        run: |
          # 1. Desativar serviços desnecessários para liberar CPU/RAM
          Set-Service -Name DiagTrack -StartupType Disabled -Force
          Set-Service -Name WSearch -StartupType Disabled -Force
          Set-Service -Name SysMain -StartupType Disabled -Force
          
          # 2. Spoofing de Identidade de Hardware (Crucial para não parecer VM)
          # Injeta serial de placa-mãe e BIOS genéricas mas consistentes
          $biosSerial = "To be filled by O.E.M."
          $mbSerial = "To be filled by O.E.M."
          
          Set-ItemProperty -Path 'HKLM:\HARDWARE\DESCRIPTION\System\BIOS' -Name 'SystemProductName' -Value "VMware Virtual Platform" -Force
          # Mas vamos mudar para algo mais "desktop" se detectado via WMI
          # Para Roblox, o segredo é ter discos e CPU visíveis.
          
          # Forçar uso de GPU padrão sem limitações de DRAM virtual
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers' -Name 'SchedulerIntelligent' -Value 0 -Force
          
          # Aumentar limite de memória de sistema para apps
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer' -Name 'SmartMemoryManagement' -Value 0 -Force

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -Description "High Perforance User"
              Add-LocalGroupMember -Group "Administrators" -Member "RDP"
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          } else {
              Set-LocalUser -Name "RDP" -Password $securePass
          }
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-${env:TS_VERSION}-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Install Roblox Player (Silent & Optimized)
        run: |
          $robloxInstallerUrl = "https://clientcdn.roblox.com/v/client/download/win32"
          $installerPath = "$env:TEMP\RobloxSetup.exe"
          
          Write-Host "Downloading latest Roblox..."
          Invoke-WebRequest -Uri $robloxInstallerUrl -OutFile $installerPath
          
          Write-Host "Installing Roblox silently..."
          Start-Process -FilePath $installerPath -ArgumentList "/silent" -Wait
          
          Remove-Item $installerPath -Force
          
          # Verificar instalação
          if (Test-Path "$env:LOCALAPPDATA\Roblox\Versions") {
              Write-Host "Roblox installed successfully."
          } else {
              Write-Error "Roblox installation verification failed."
              exit 1
          }

      - name: Auto-Login and Verify Environment
        run: |
          # Configurar login automático para o usuário RDP
          $regPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"
          Set-ItemProperty -Path $regPath -Name "AutoAdminLogon" -Value "1"
          Set-ItemProperty -Path $regPath -Name "DefaultUsername" -Value "RDP"
          Set-ItemProperty -Path $regPath -Name "DefaultPassword" -Value "${{ env.password }}" # Note: password needs to be exported first or re-entered here if not in env properly
          
          # Reboot para aplicar tudo e carregar o Roblox
          Restart-Computer -Force
          
          # Aguardar boot completo
          Start-Sleep -Seconds 60
          
          Write-Host "System Ready for RDP connection on Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "User: RDP"
          Write-Host "Password: $env.RDP_CREDS"
