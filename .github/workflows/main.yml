name: Windows Cloud PC - AnyDesk Daemon Estável

on:
  workflow_dispatch:
    inputs:
      anydesk_id:
        description: 'AnyDesk ID Fixo (opcional)'
        required: false
        default: ''

env:
  ANYDESK_VERSION: "9.2.5" # Versão estável conhecida por funcionar bem em headless
  ANYDESK_URL: "https://download.anydesk.com/AnyDesk_9.2.5_Windows.zip"
  ANYDESK_DIR: "${{ github.workspace }}/anydesk"
  ANYDESK_EXE: "${{ github.workspace }}/anydesk/AnyDesk.exe"
  PROCESSOR_COUNT: 8
  OPENGL: "1"
  MEMORY_GB: 16

jobs:
  build:
    name: Iniciando Sistema Reforçado
    runs-on: windows-latest
    timeout-minutes: 10080 # Quase uma semana de uptime
    env:
      GITHUB_PRESERVE_WORKFLOW: true

    steps:
      - name: 📥 Baixar AnyDesk Portable
        run: |
          Write-Host "Baixando AnyDesk versão ${{ env.ANYDESK_VERSION }}..."
          
          # Cria pasta temporária
          $tempDir = Join-Path $env:TEMP "AnyDesk_Download"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          
          # Baixa o ZIP
          $zipPath = Join-Path $tempDir "AnyDesk.zip"
          Invoke-WebRequest -Uri "${{ env.ANYDESK_URL }}" -OutFile $zipPath -UseBasicParsing
          
          # Extrai
          Expand-Archive -Path $zipPath -DestinationPath "${{ env.ANYDESK_DIR }}" -Force
          
          # Limpa ZIP
          Remove-Item $zipPath -Force
          Remove-Item $tempDir -Recurse -Force
          
          Write-Host "✅ AnyDesk baixado e extraído."

      - name: ⚡ Preparar e Iniciar Daemon
        run: |
          $anydeskExe = "${{ env.ANYDESK_EXE }}"
          $dir = "${{ env.ANYDESK_DIR }}"
          
          # 1. Verifica existência
          if (-not (Test-Path $anydeskExe)) {
              Write-Error "❌ ERRO: AnyDesk não encontrado em $anydeskExe"
              exit 1
          }

          # 2. Cria estrutura obrigatória para rodar headless
          New-Item -ItemType Directory -Force -Path "$dir\data" | Out-Null
          New-Item -ItemType File -Force -Path "$dir\user.conf" | Out-Null

          # 3. Define ID Fixo se fornecido
          if ("${{ github.event.inputs.anydesk_id }}" -ne "") {
              Write-Host "Configurando ID Fixo: ${{ github.event.inputs.anydesk_id }}"
              "id=${{ github.event.inputs.anydesk_id }}" | Out-File -FilePath "$dir\user.conf" -Encoding ascii
          } else {
              Write-Host "ID aleatório será gerado automaticamente."
          }

          # 4. Mata qualquer processo órfão
          Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue | Stop-Process -Force

          # 5. Inicia via CMD para evitar bloqueios do PowerShell
          Start-Process cmd.exe -ArgumentList "/c", "`"$anydeskExe`" --daemon" -WindowStyle Hidden

          Write-Host "Aguardando inicialização completa..."
          Start-Sleep -Seconds 30

          # 6. Validação crítica
          $pid = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
          if ($pid) {
              Write-Host "✅ Daemon iniciado com sucesso (PID: $($pid.Id))"
          } else {
              Write-Error "❌ FALHA CRÍTICA: O daemon do AnyDesk morreu imediatamente após iniciar."
              exit 1
          }

      - name: 🔄 Monitoramento Contínuo e Reinício Automático
        run: |
          Write-Host "Iniciando monitoramento contínuo..."
          while ($true) {
              $anydesk = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              
              if (-not $anydesk -or $anydesk.HasExited) {
                  Write-Warning "⚠️ AnyDesk detectado como parado. Tentando reiniciar..."
                  
                  # Tenta reiniciar
                  $exepath = "${{ env.ANYDESK_EXE }}"
                  if (Test-Path $exepath) {
                      Start-Process cmd.exe -ArgumentList "/c", "`"$exepath`" --daemon" -WindowStyle Hidden
                      Start-Sleep -Seconds 15 # Espera para ver se estabiliza
                      
                      $checkPid = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
                      if ($checkPid) {
                          Write-Host "✅ Reinício bem-sucedido (PID: $($checkPid.Id))"
                      } else {
                          Write-Error "❌ Falha ao reiniciar após detecção de parada."
                          break
                      }
                  } else {
                      Write-Error "❌ Arquivo AnyDesk perdido durante execução."
                      break
                  }
              }
              
              Start-Sleep -Seconds 60
          }

      - name: 💤 Manter Sistema Ativo (Heartbeat)
        run: |
          # Garante que o job não seja considerado "inativo" pelo GitHub
          Write-Host "Sistema ativo. Aguardando término manual ou timeout de ${{ job.timeout-minutes }} minutos."
          Start-Sleep -Seconds 604800 

      - name: 🧹 Limpeza Segura
        if: always()
        run: |
          Write-Host "Iniciando limpeza..."
          Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item "${{ env.ANYDESK_DIR }}" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Limpeza finalizada."
